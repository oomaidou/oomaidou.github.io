name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # 每天北京时间 10:00（UTC+8 = UTC 02:00）自动构建

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://www.shenquanquan.com/"

      - name: Refresh coupons sitemap lastmod
        run: |
          # static/coupons/sitemap.xml 是手写的，lastmod 长期不更新，
          # 导致这些页面永远进不了「近 2 天更新」的推送队列。
          # 这里按各类目目录的 git 提交时间重算，只改 public/ 里待部署的那份。
          python3 .github/scripts/refresh_coupons_sitemap.py public/coupons/sitemap.xml

      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::未配置 SERVER_SSH_KEY secret，跳过服务器部署"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 43.136.73.181 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./public/ ubuntu@43.136.73.181:/var/www/shenquanquan/
          echo "服务器部署完成"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  search-push:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Extract recently updated URLs from sitemap
        run: |
          # 等待 GitHub Pages CDN 更新
          sleep 30

          # 两份 sitemap 都要读：根 sitemap 是 Hugo 生成的文章页，
          # /coupons/sitemap.xml 是手写的优惠券类目页，不在根 sitemap 里。
          curl -sS --retry 3 -o sitemap-root.xml "https://www.shenquanquan.com/sitemap.xml"
          curl -sS --retry 3 -o sitemap-coupons.xml "https://www.shenquanquan.com/coupons/sitemap.xml"
          cat sitemap-root.xml sitemap-coupons.xml > sitemap.xml

          # 从 sitemap 提取近 2 天新增/更新的 URL
          # urls-baidu.txt：最多 10 条 —— 百度配额就是 10 条/天，且
          #   提交条数超过当日剩余配额时是「整批拒绝」（error 400 over quota），
          #   不是收下能收的部分，所以宁可少提交也不能超（2026-08-02 实测确认）
          # urls-all.txt：全量（IndexNow 无限制）
          python3 <<'EOF'
          import re
          from datetime import datetime, timedelta, timezone

          xml = open("sitemap.xml", encoding="utf-8").read()

          entries = re.findall(
              r"<url>\s*<loc>(.*?)</loc>\s*(?:<lastmod>(.*?)</lastmod>)?", xml
          )
          cutoff = (datetime.now(timezone(timedelta(hours=8))) - timedelta(days=2)).date()

          urls = []
          for loc, lastmod in entries:
              if lastmod and datetime.fromisoformat(lastmod[:10]).date() >= cutoff:
                  urls.append(loc)

          # 百度推送配额有限（10 条/天），按价值排序：
          # 文章页 > 首页 > 优惠券类目落地页 > 标签/分类等聚合页
          def priority(u):
              if "/posts/" in u and not u.rstrip("/").endswith("posts"):
                  return 0
              if u.rstrip("/") == "https://www.shenquanquan.com":
                  return 1
              if "/coupons/" in u:
                  return 2
              return 3

          urls.sort(key=priority)

          with open("urls-baidu.txt", "w") as f:
              f.write("\n".join(urls[:10]))
          with open("urls-all.txt", "w") as f:
              f.write("\n".join(urls))
          print(f"sitemap 共 {len(entries)} 个页面，近 2 天更新 {len(urls)} 个")
          EOF

      - name: Push to Baidu
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "::notice::未配置 BAIDU_PUSH_TOKEN secret，跳过百度推送"
            exit 0
          fi

          if [ ! -s urls-baidu.txt ]; then
            echo "近 2 天没有新增或更新的页面，跳过推送"
            exit 0
          fi

          echo "待推送 URL："
          cat urls-baidu.txt
          echo ""

          API="http://data.zz.baidu.com/urls?site=https://www.shenquanquan.com&token=${BAIDU_PUSH_TOKEN}"
          TOTAL=$(grep -c . urls-baidu.txt)

          # 超配额是整批拒绝，所以逐级减少条数重试，尽量把剩余配额用上。
          # 例：剩余 3 条时，提交 10 条整批被拒 → 退到 5 条仍被拒 → 退到 2 条成功。
          # 从实际待推条数起步，被拒就减半。固定阶梯（10/5/2/1）会漏推：
          # 待推 3 条时会跳过 10 和 5 直接试 2 条，剩下 1 条永远推不出去。
          PUSHED=0
          N=$TOTAL
          [ "$N" -gt 10 ] && N=10
          while [ "$N" -ge 1 ]; do
            head -n "$N" urls-baidu.txt > batch.txt

            # 505 是百度侧临时抖动，重试一次
            for ATTEMPT in 1 2; do
              curl -sS --max-time 30 -H 'Content-Type:text/plain' --data-binary @batch.txt \
                "$API" > baidu-response.json || echo '{"error":-1,"message":"curl failed"}' > baidu-response.json
              grep -q '"error":505' baidu-response.json || break
              echo "百度返回 505，5 秒后重试"; sleep 5
            done

            echo "提交 $N 条 → $(cat baidu-response.json)"

            if grep -q '"success"' baidu-response.json; then
              PUSHED=$(python3 -c "import json;print(json.load(open('baidu-response.json'))['success'])")
              break
            elif grep -q 'over quota' baidu-response.json; then
              N=$((N / 2))      # 配额不够，减半再试
              continue
            else
              # token 失效、站点不匹配等真实错误，直接失败以便察觉
              echo "::error::百度推送返回未知错误"
              exit 1
            fi
          done

          if [ "$PUSHED" -eq 0 ]; then
            # 明确区分「配额耗尽」和「推成功了」，不让 0 条推送以绿灯蒙混过去
            echo "::warning::百度当日配额已用完，本次 0 条推送成功（共 $TOTAL 条待推，明日 Action 会重试）"
          else
            echo "推送成功 $PUSHED 条（共 $TOTAL 条待推）"
          fi

      - name: Push to IndexNow (Bing)
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s urls-all.txt ]; then
            echo "近 2 天没有新增或更新的页面，跳过推送"
            exit 0
          fi

          python3 <<'EOF'
          import json

          urls = [u.strip() for u in open("urls-all.txt", encoding="utf-8") if u.strip()]
          payload = {
              "host": "www.shenquanquan.com",
              "key": "7e4fe8c7039e33b6a616abdc34f3f40e",
              "keyLocation": "https://www.shenquanquan.com/7e4fe8c7039e33b6a616abdc34f3f40e.txt",
              "urlList": urls
          }
          with open("indexnow.json", "w") as f:
              json.dump(payload, f)
          print(f"IndexNow 推送 {len(urls)} 条 URL")
          EOF

          HTTP_CODE=$(curl -sS -o indexnow-resp.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow.json)
          echo "IndexNow 响应码: $HTTP_CODE"
          cat indexnow-resp.txt || true
          echo ""

          # 200/202 都表示接受成功
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]